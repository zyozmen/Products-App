version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: products-app-frontend
    ports:
      - "4200:4200"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGIN: http://localhost:4200
      VITE_APP_PRODUCTS_API_URL: http://host.docker.internal:8080/api/productos
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: products-app-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
